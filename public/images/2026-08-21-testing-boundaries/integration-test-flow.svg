<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">상품 목록 통합 테스트의 연결 흐름</title>
  <desc id="desc">사용자의 필터 조작이 ProductListFilters, NuqsTestingAdapter, React Query, MSW를 거쳐 ProductList 화면 갱신으로 이어진다. 실제 URL과 실제 API는 각각 테스트 어댑터와 MSW로 대체한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#526173"/>
    </marker>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1e293b" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 750; }
      .label { font-size: 19px; font-weight: 750; }
      .sub { font-size: 14px; font-weight: 500; fill: #64748b; }
      .card { filter: url(#shadow); stroke-width: 2.5; }
      .flow { stroke: #526173; stroke-width: 3.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#fbfaf7"/>
  <text class="title" x="600" y="58" text-anchor="middle">사용자 조작부터 화면 갱신까지 한 흐름으로 본다</text>
  <rect x="58" y="134" width="1084" height="350" rx="28" fill="#f4f1ea" stroke="#d5d0c6" stroke-width="2"/>
  <text x="92" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="750" fill="#64748b">JSDOM INTEGRATION TEST</text>
  <rect class="card" x="92" y="220" width="150" height="116" rx="20" fill="#ffffff" stroke="#8ba5b8"/>
  <text class="label" x="167" y="264" text-anchor="middle">userEvent</text>
  <text class="sub" x="167" y="292" text-anchor="middle">필터 선택</text>
  <text class="sub" x="167" y="315" text-anchor="middle">버튼 클릭</text>
  <line class="flow" x1="252" y1="278" x2="302" y2="278"/>
  <rect class="card" x="314" y="220" width="174" height="116" rx="20" fill="#edf3f8" stroke="#6496b8"/>
  <text class="label" x="401" y="259" text-anchor="middle">ProductList</text>
  <text class="label" x="401" y="282" text-anchor="middle">Filters</text>
  <text class="sub" x="401" y="313" text-anchor="middle">조건 변경 요청</text>
  <line class="flow" x1="498" y1="278" x2="548" y2="278"/>
  <rect class="card" x="560" y="206" width="194" height="144" rx="20" fill="#f4edf6" stroke="#a06cad"/>
  <text class="label" x="657" y="250" text-anchor="middle">NuqsTesting</text>
  <text class="label" x="657" y="273" text-anchor="middle">Adapter</text>
  <text class="sub" x="657" y="305" text-anchor="middle">URL 상태를 메모리에 유지</text>
  <rect x="589" y="320" width="136" height="22" rx="11" fill="#e8d9eb"/>
  <text x="657" y="336" text-anchor="middle" font-size="12" font-weight="750" fill="#74447f">실제 URL을 대체</text>
  <line class="flow" x1="764" y1="278" x2="814" y2="278"/>
  <rect class="card" x="826" y="220" width="150" height="116" rx="20" fill="#e9f3ee" stroke="#65a17c"/>
  <text class="label" x="901" y="264" text-anchor="middle">React Query</text>
  <text class="sub" x="901" y="292" text-anchor="middle">새 query key</text>
  <text class="sub" x="901" y="315" text-anchor="middle">목록 요청</text>
  <line class="flow" x1="986" y1="278" x2="1024" y2="278"/>
  <rect class="card" x="1036" y="206" width="76" height="144" rx="20" fill="#fbf0df" stroke="#c18f49"/>
  <text class="label" x="1074" y="262" text-anchor="middle">MSW</text>
  <text class="sub" x="1074" y="292" text-anchor="middle">응답</text>
  <text x="1074" y="329" text-anchor="middle" font-size="11" font-weight="750" fill="#936928">API 대체</text>
  <path d="M1074 360 V418 H744" fill="none" class="flow"/>
  <rect class="card" x="438" y="386" width="294" height="76" rx="18" fill="#ffffff" stroke="#65a17c"/>
  <text class="label" x="585" y="418" text-anchor="middle">ProductList가 새 응답을 렌더링</text>
  <text class="sub" x="585" y="444" text-anchor="middle">화면에서 상품과 순서를 확인</text>
  <rect x="152" y="544" width="896" height="92" rx="22" fill="#edf3f8" stroke="#6496b8" stroke-width="2"/>
  <text class="label" x="600" y="580" text-anchor="middle">E2E 한 건이 대체된 URL 층을 실제로 통과한다</text>
  <text class="sub" x="600" y="610" text-anchor="middle">필터 조작 → 주소 변경 → 같은 URL로 재진입 → 조건이 반영된 목록</text>
</svg>
