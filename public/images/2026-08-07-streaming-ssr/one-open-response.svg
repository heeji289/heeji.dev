<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">처음 생각한 흐름과 실제 Streaming SSR 응답 비교</title>
  <desc id="desc">왼쪽은 fallback 응답이 끝난 뒤 브라우저가 다시 요청한다고 오해한 흐름이고, 오른쪽은 하나의 문서 응답이 열린 상태에서 Shell과 실제 콘텐츠가 차례로 도착하는 실제 흐름이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#526173"/>
    </marker>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 750; }
      .panel-title { font-size: 22px; font-weight: 750; }
      .label { font-size: 19px; font-weight: 700; }
      .sub { font-size: 16px; font-weight: 500; fill: #64748b; }
      .panel { stroke-width: 2.5; }
      .box { fill: #ffffff; stroke-width: 2.2; filter: url(#shadow); }
      .flow { fill: none; stroke: #526173; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="570" rx="24" fill="#fbfaf7"/>
  <text class="title" x="500" y="54" text-anchor="middle">첫 화면이 도착해도 응답은 끝나지 않았다</text>

  <rect class="panel" x="38" y="88" width="432" height="414" rx="24" fill="#fff5f0" stroke="#d58469"/>
  <rect x="164" y="72" width="180" height="40" rx="20" fill="#bd654b"/>
  <text class="panel-title" x="254" y="99" text-anchor="middle" fill="#ffffff">처음의 오해</text>

  <rect class="box" x="88" y="142" width="332" height="66" rx="16" stroke="#d58469"/>
  <text class="label" x="254" y="171" text-anchor="middle">Shell + fallback</text>
  <text class="sub" x="254" y="194" text-anchor="middle">첫 HTML 응답</text>
  <path class="flow" d="M254 209 V247"/>

  <rect class="box" x="133" y="252" width="242" height="58" rx="15" stroke="#d58469"/>
  <text class="label" x="254" y="288" text-anchor="middle">응답 종료</text>

  <path d="M254 311 V357" stroke="#bd654b" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text class="sub" x="274" y="340">다시 요청?</text>

  <rect class="box" x="88" y="363" width="332" height="66" rx="16" stroke="#d58469"/>
  <text class="label" x="254" y="392" text-anchor="middle">실제 콘텐츠</text>
  <text class="sub" x="254" y="415" text-anchor="middle">두 번째 HTML 응답</text>
  <circle cx="400" cy="444" r="24" fill="#bd654b"/>
  <path d="M390 434 L410 454 M410 434 L390 454" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <rect class="panel" x="502" y="88" width="460" height="414" rx="24" fill="#eef7f1" stroke="#64a278"/>
  <rect x="638" y="72" width="188" height="40" rx="20" fill="#4f8e63"/>
  <text class="panel-title" x="732" y="99" text-anchor="middle" fill="#ffffff">실제 흐름</text>

  <text class="label" x="732" y="144" text-anchor="middle">하나의 문서 요청</text>
  <text class="sub" x="732" y="169" text-anchor="middle">같은 HTTP 응답을 끝까지 유지</text>
  <path d="M555 198 V426" stroke="#4f8e63" stroke-width="7" stroke-linecap="round"/>
  <circle cx="555" cy="207" r="11" fill="#4f8e63"/>
  <circle cx="555" cy="346" r="11" fill="#4f8e63"/>
  <circle cx="555" cy="426" r="11" fill="#4f8e63"/>

  <rect class="box" x="586" y="181" width="324" height="72" rx="16" stroke="#6eabc9"/>
  <text class="label" x="748" y="212" text-anchor="middle">Shell + fallback</text>
  <text class="sub" x="748" y="237" text-anchor="middle">준비된 HTML부터 전송</text>

  <text class="sub" x="580" y="294">응답이 열린 채 데이터 조회 중</text>
  <path d="M587 304 H880" stroke="#8ba498" stroke-width="2" stroke-dasharray="7 7"/>

  <rect class="box" x="586" y="322" width="324" height="72" rx="16" stroke="#64a278"/>
  <text class="label" x="748" y="353" text-anchor="middle">실제 HTML + 교체 script</text>
  <text class="sub" x="748" y="378" text-anchor="middle">같은 응답에 이어서 전송</text>

  <text class="label" x="586" y="433">응답 종료</text>
  <text class="sub" x="586" y="458">모든 렌더링과 출력이 끝난 뒤</text>

  <rect x="194" y="520" width="612" height="34" rx="17" fill="#e8eef3"/>
  <text x="500" y="543" text-anchor="middle" font-size="17" font-weight="700" fill="#465466">첫 화면의 도착과 HTTP 응답의 종료는 같은 시점이 아니다</text>
</svg>
